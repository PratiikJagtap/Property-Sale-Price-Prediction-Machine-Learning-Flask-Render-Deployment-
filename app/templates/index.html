<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Price Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; text-align: center; padding: 40px; }
        form { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input { margin: 8px; padding: 8px; width: 250px; }
        button { margin-top: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>🏡 Property Sale Price Prediction</h2>
    <form action="/predict" method="POST">
        <input type="number" name="Building_Class" placeholder="Building Class" required><br>
        <input type="number" name="Lot_Size" placeholder="Lot Size" required><br>
        <input type="number" name="Neighborhood" placeholder="Neighborhood" required><br>
        <input type="number" name="Overall_Material" placeholder="Overall Material" required><br>
        <input type="number" name="House_Type" placeholder="House Type" required><br>
        <input type="number" name="House_Condition" placeholder="House Condition" required><br>
        <input type="number" name="Property_Shape" placeholder="Property Shape" required><br>
        <input type="number" name="Property_age" placeholder="Property Age" required><br>
        <input type="number" name="Kitchen_Quality" placeholder="Kitchen Quality" required><br>
        <input type="number" name="House_Design" placeholder="House Design" required><br>
        <input type="number" name="Air_Conditioning" placeholder="Air Conditioning" required><br>
        <input type="number" name="Total_living_area" placeholder="Total Living Area" required><br>
        <input type="number" name="Garage_Area" placeholder="Garage Area" required><br>
        <input type="number" name="Sale_Condition" placeholder="Sale Condition" required><br>
        <button type="submit">Predict Price</button>
    </form>

    <h3 style="margin-top:20px;">{{ prediction_text }}</h3>
</body>
</html>
